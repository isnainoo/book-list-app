name: book_list_app
description: A Flutter app to browse a list of books with detail pages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/logo/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"

  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo/logo.png"